name: Build QGIS plugin zip package + MkDocs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python3 -m pip install pb_tool mkdocs mkdocs-material

    - name: Build MkDocs site and copy to plugin
      run: |
        mkdocs build --clean
        rm -rf docs
        cp -r site docs

    - name: Deploy & zip
      run: |
        pb_tool deploy -y
        pb_tool zip -q

    - name: Prepare artifact
      run: |
        echo "Obsah zip_build:"
        ls -laR zip_build || echo "zip_build neexistuje"
        cd zip_build
        for f in *.zip; do
          [ -e "$f" ] || { echo "pb_tool zip nevytvořil žádný zip"; exit 1; }
          unzip -q "$f"
        done
        rm -f *.zip *.txt
        ls -laR .

    - name: Upload ZIP artifact
      uses: actions/upload-artifact@v4
      with:
        name: qgis-jvf-dtm-plugin
        path: zip_build/
        if-no-files-found: error

    - name: Upload docs preview
      if: github.event_name == 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: docs-preview
        path: site/
        if-no-files-found: error
        retention-days: 7

    - name: Deploy MkDocs to GitHub Pages
      if: github.event_name != 'pull_request'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site